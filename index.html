<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenador de ajedrez</title>
<script src="chess.js"></script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6f9f">
<script src="db.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f7;--panel:#fff;--ink:#1b2733;--muted:#5b6b7a;--line:#d5dde4;--sq-l:#d9e2e9;--sq-d:#6f8da5;--sel:#f2c14e;--dot:rgba(27,39,51,.35);--last:rgba(242,193,78,.45);--check:#d9534f;--wp:#fff;--bp:#14202b;--accent:#2f6f9f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17222d;--ink:#e7eef4;--muted:#93a4b3;--line:#2a3947;--sq-l:#9fb4c4;--sq-d:#4a6579;--dot:rgba(10,15,20,.45);--accent:#6fb1e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17222d;--ink:#e7eef4;--muted:#93a4b3;--line:#2a3947;--sq-l:#9fb4c4;--sq-d:#4a6579;--dot:rgba(10,15,20,.45);--accent:#6fb1e0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:1.35rem;margin:4px 0 8px}
#status{font-family:system-ui,sans-serif;font-weight:600;min-height:1.5em;margin:0 0 8px}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:4px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:clamp(26px,9.2vw,50px);line-height:1}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--sel)}.sq.chk{box-shadow:inset 0 0 0 4px var(--check)}
.sq.mv::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--dot)}
.sq.cap::after{width:86%;height:86%;background:transparent;border:4px solid var(--dot)}
.pc{position:relative;z-index:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif}
.pc.w{color:var(--wp);text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}.pc.b{color:var(--bp);text-shadow:0 0 1px rgba(255,255,255,.5)}
.co{position:absolute;z-index:2;font:600 10px system-ui,sans-serif;opacity:.7;pointer-events:none}.co.r{top:2px;left:3px}.co.f{bottom:2px;right:3px}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
#banner{font-family:system-ui,sans-serif;font-size:.95rem;min-height:2.6em;margin:8px 0 0;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,select{font:600 .95rem system-ui,sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
h2{font-size:1rem;margin:0 0 6px}
#moves{position:relative;font-family:system-ui,sans-serif;font-size:.95rem;display:grid;grid-template-columns:2.2em 1fr 1fr;gap:2px 6px;max-height:190px;overflow-y:auto}
#moves .n{color:var(--muted);padding:4px 0}#moves .empty{grid-column:1/-1;color:var(--muted)}
.mc{padding:4px 6px;border-radius:6px;cursor:pointer}.mc.cur{background:var(--accent);color:#fff}
.sym{margin-left:4px;font-weight:800}.mc.cur .sym{color:#fff!important}
.t-best{color:#2e9e5b}.t-exc{color:#4aa36c}.t-good{color:#7a8f55}.t-inac{color:#c99a1c}.t-err{color:#e07b22}.t-blun{color:#d9534f}.t-bril{color:#1fb5c4}
.t{font-weight:700}
#eng-st,#sum{font:.9rem system-ui,sans-serif;color:var(--muted);margin:4px 0}
.eng{font:.92rem system-ui,sans-serif;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
#msg{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--check);min-height:1.2em;margin:6px 0 0}
.bdg{position:absolute;top:2px;right:2px;z-index:3;min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 11px/1 system-ui,sans-serif;color:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
.bdg.t-best{background:#2e9e5b}.bdg.t-exc{background:#4aa36c}.bdg.t-good{background:#7a8f55}.bdg.t-inac{background:#c99a1c}.bdg.t-err{background:#e07b22}.bdg.t-blun{background:#d9534f}.bdg.t-bril{background:#1fb5c4}
</style>
</head>
<body>
<main>
  <h1>Centro de entrenamiento</h1>
  <p id="status" aria-live="polite"></p>
  <div id="board" role="grid" aria-label="Tablero de ajedrez"></div>
  <div id="banner" aria-live="polite"></div>
  <div class="nav">
    <button id="first" aria-label="Al inicio">⏮</button><button id="prev" aria-label="Jugada anterior">◀</button>
    <button id="next" aria-label="Jugada siguiente">▶</button><button id="lastb" aria-label="Al final">⏭</button>
  </div>
  <div class="row"><button id="flip">Girar tablero</button><button id="new" class="p">Partida nueva</button></div>
  <section><h2>Jugadas</h2><div id="moves"></div></section>
  <section>
    <h2>Stockfish</h2>
    <p id="eng-st">Cargando motor…</p>
    <div class="row" style="margin:4px 0"><button id="retry" hidden>Reintentar motor</button></div>
    <div class="eng"><label><input type="checkbox" id="vs"> Jugar contra el motor (tú, blancas)</label>
      <select id="lvl"><option value="0">Muy fácil</option><option value="5">Fácil</option><option value="10" selected>Medio</option><option value="15">Difícil</option><option value="20">Máximo</option></select></div>
    <div class="eng"><label><input type="checkbox" id="live"> Análisis en vivo (valora cada jugada y sugiere la siguiente)</label></div>
    <div class="eng"><label>Yo jugué con <select id="me"><option value="w">Blancas</option><option value="b">Negras</option></select></label></div>
    <div class="row" style="margin:8px 0"><button id="ana-btn" class="p">Analizar partida</button></div>
    <p id="sum"></p>
  </section>
  <section>
    <h2>Cargar partida (PGN de Chess.com)</h2>
    <textarea id="pgn" placeholder="Pega aquí el PGN de tu partida" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div class="row" style="margin-bottom:0"><button id="load">Cargar PGN</button><button id="copy">Copiar PGN</button></div>
    <p id="msg"></p>
  </section>
</main>
<script>
(function(){
var START=new Chess().fen(),evc={},liveTok=0,chain=Promise.resolve(),moves=[],fens=[START],ana=[],ply=0,game=new Chess(),sel=null,flipped=false,busy=false,ready=false,eng=null,pending=null,lastErr="";
var G={p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"},VAL={p:1,n:3,b:3,r:5,q:9,k:0};
var LAB={best:["Mejor","t-best","★"],exc:["Excelente","t-exc","!"],good:["Buena","t-good","✓"],book:["Apertura","t-good","📖"],inac:["Imprecisión","t-inac","?!"],err:["Error","t-err","?"],blun:["Grave error","t-blun","??"],bril:["Brillante","t-bril","!!"]};
var $=function(id){return document.getElementById(id)},boardEl=$("board");
function sqName(r,c){return "abcdefgh"[c]+(8-r)}
function sync(){game=new Chess(fens[ply]);sel=null;render();live()}

function render(){
  var b=game.board(),targets={},html="",last=ply>0?moves[ply-1]:null,kingSq=null;
  if(sel)game.moves({square:sel,verbose:true}).forEach(function(m){targets[m.to]=1});
  if(game.in_check())for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(p&&p.type==="k"&&p.color===game.turn())kingSq=sqName(r,c)}
  for(var i=0;i<8;i++)for(var j=0;j<8;j++){
    var r2=flipped?7-i:i,c2=flipped?7-j:j,n=sqName(r2,c2),p2=b[r2][c2],cl="sq "+((r2+c2)%2===0?"l":"d");
    if(last&&(last.from===n||last.to===n))cl+=" last";
    if(sel===n)cl+=" sel";if(kingSq===n)cl+=" chk";if(targets[n])cl+=p2?" cap":" mv";
    html+='<div class="'+cl+'" data-sq="'+n+'" role="gridcell">';
    if(j===0)html+='<span class="co r">'+(8-r2)+'</span>';
    if(i===7)html+='<span class="co f">'+"abcdefgh"[c2]+'</span>';
    if(p2)html+='<span class="pc '+p2.color+'">'+G[p2.type]+'</span>';
    if(last&&last.to===n&&ana[ply-1])html+='<span class="bdg '+LAB[ana[ply-1].k][1]+'">'+LAB[ana[ply-1].k][2]+'</span>';
    html+='</div>';
  }
  boardEl.innerHTML=html;status();moveList();banner();
  $("first").disabled=$("prev").disabled=ply===0;$("next").disabled=$("lastb").disabled=ply===moves.length;
}
function status(){
  var s;
  if(game.in_checkmate())s="Jaque mate. Ganan las "+(game.turn()==="w"?"negras":"blancas")+".";
  else if(game.in_stalemate())s="Tablas por ahogado.";
  else if(game.insufficient_material())s="Tablas por material insuficiente.";
  else if(game.in_draw())s="Tablas.";
  else s="Juegan las "+(game.turn()==="w"?"blancas":"negras")+(game.in_check()?" (jaque)":"")+".";
  $("status").textContent=s;
}
function moveList(){
  var out="";
  if(!moves.length)out='<span class="empty">Aún no hay jugadas.</span>';
  function cell(i){
    if(!moves[i])return "<span></span>";
    var a=ana[i],sy=a?'<b class="sym '+LAB[a.k][1]+'">'+LAB[a.k][2]+'</b>':"";
    return '<span class="mc'+(ply===i+1?" cur":"")+'" data-p="'+(i+1)+'">'+moves[i].san+sy+'</span>';
  }
  for(var i=0;i<moves.length;i+=2)out+='<span class="n">'+(i/2+1)+'.</span>'+cell(i)+cell(i+1);
  var el=$("moves");el.innerHTML=out;
  var cur=el.querySelector(".cur");if(cur)el.scrollTop=cur.offsetTop-el.clientHeight/2;
}
function banner(){
  var t;
  if(ply===0)t="Posición inicial.";
  else{
    var m=moves[ply-1],a=ana[ply-1],num=Math.ceil(ply/2)+(m.color==="w"?". ":"… ");
    t="<b>"+num+m.san+"</b> — ";
    t+=a?'<span class="t '+LAB[a.k][1]+'">'+LAB[a.k][0]+"</span>"+a.hint:($("live").checked?"analizando…":"sin analizar todavía.");
  }
  var e=$("live").checked&&evc[fens[ply]];
  if(e)t+="<br>Evaluación "+evTxt(e)+(e.best&&!game.game_over()?" · Sugerencia: <b>"+sugSan(fens[ply],e)+"</b>":"");
  $("banner").innerHTML=t;
}
$("moves").addEventListener("click",function(e){var c=e.target.closest(".mc");if(c){ply=+c.dataset.p;sync()}});
$("first").onclick=function(){ply=0;sync()};
$("prev").onclick=function(){if(ply>0){ply--;sync()}};
$("next").onclick=function(){if(ply<moves.length){ply++;sync()}};
$("lastb").onclick=function(){ply=moves.length;sync()};
$("flip").onclick=function(){flipped=!flipped;render()};
$("new").onclick=function(){if(busy)return;moves=[];fens=[START];ana=[];ply=0;$("sum").textContent="";$("msg").textContent="";sync()};

function push(mv){
  if(ply<moves.length)$("sum").textContent="";
  moves=moves.slice(0,ply);fens=fens.slice(0,ply+1);ana=ana.slice(0,ply);
  moves.push(mv);fens.push(game.fen());ply=moves.length;sync();
}
boardEl.addEventListener("click",function(e){
  var el=e.target.closest(".sq");
  if(!el||busy||game.game_over()||($("vs").checked&&game.turn()!=="w"))return;
  var n=el.dataset.sq,piece=game.get(n);
  if(sel){
    if(sel===n){sel=null;return render()}
    var mv=game.move({from:sel,to:n,promotion:"q"});
    if(mv){push(mv);return engineTurn()}
  }
  sel=(piece&&piece.color===game.turn())?n:null;render();
});

/* ---- PGN tolerante (móvil: saltos de línea raros, comentarios, relojes) ---- */
function parsePgn(t){
  t=t.replace(/\r/g,"").replace(/…/g,"...").replace(/[“”]/g,'"');
  var fm=t.match(/\[FEN\s+"([^"]+)"\]/i),st=fm?fm[1]:START;
  t=t.replace(/\[[^\]]*\]/g," ").replace(/\{[^}]*\}/g," ").replace(/;[^\n]*/g," ");
  while(/\([^()]*\)/.test(t))t=t.replace(/\([^()]*\)/g," ");
  var toks=t.split(/\s+/).map(function(x){return x.replace(/^\d+\.+/,"").replace(/[!?]+$/,"").replace(/^\$\d+$/,"")}).filter(function(x){return x&&!/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x)});
  var g=new Chess(st),ms=[],fs=[g.fen()],bad=null;
  for(var i=0;i<toks.length;i++){var m=g.move(toks[i],{sloppy:true});if(!m){bad=toks[i];break}ms.push(m);fs.push(g.fen())}
  return {ms:ms,fs:fs,bad:bad};
}
$("load").onclick=function(){
  if(busy)return;
  var txt=$("pgn").value.trim();
  if(!txt){$("msg").textContent="Pega primero un PGN.";return}
  var r;try{r=parsePgn(txt)}catch(e){r={ms:[]}}
  if(!r.ms.length){$("msg").textContent="No se encontró ninguna jugada válida en ese texto.";return}
  moves=r.ms;fens=r.fs;ana=[];ply=0;$("sum").textContent="";
  $("msg").textContent=r.bad?"Se cargaron "+r.ms.length+" jugadas; se detuvo en «"+r.bad+"».":"";
  sync();
};
$("copy").onclick=function(){
  var g=new Chess(fens[0]);moves.forEach(function(m){g.move({from:m.from,to:m.to,promotion:m.promotion})});
  var t=g.pgn();
  try{navigator.clipboard.writeText(t).then(function(){$("msg").style.color="var(--accent)";$("msg").textContent="PGN copiado."},function(){$("pgn").value=t})}catch(e){$("pgn").value=t}
};

/* ---- Stockfish ---- */
var SRC=["stockfish.wasm.js","stockfish.js","https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js","https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js"];
function setEng(t){$("eng-st").textContent=t}
function startEngine(i){
  if(i>=SRC.length){setEng("No se pudo iniciar el motor ("+lastErr+"). La primera vez necesita internet.");$("retry").hidden=false;return}
  $("retry").hidden=true;setEng("Cargando motor…");
  var w,timer,ok=false;
  var s=SRC[i];try{w=new Worker(s.indexOf("http")===0?URL.createObjectURL(new Blob(['importScripts("'+s+'")'],{type:"application/javascript"})):s)}catch(e){lastErr=String(e&&e.message||e);return startEngine(i+1)}
  function next(msg){if(ok)return;clearTimeout(timer);try{w.terminate()}catch(e){}lastErr=msg;startEngine(i+1)}
  timer=setTimeout(function(){next("tiempo agotado")},15000);
  w.onerror=function(e){next((e&&e.message)||"error de carga")};
  w.onmessage=function(e){
    var l=typeof e.data==="string"?e.data:"";
    if(l==="uciok")w.postMessage("isready");
    else if(l==="readyok"&&!ok){ok=true;clearTimeout(timer);eng=w;ready=true;setEng("Motor listo (Stockfish 10).")}
    else if(ok&&pending){
      if(l.indexOf("info")===0&&!/bound/.test(l)){var m=l.match(/score (cp|mate) (-?\d+)/);if(m)pending.s={t:m[1],v:+m[2]}}
      else if(l.indexOf("bestmove")===0){var p=pending;pending=null;p.res({s:p.s,best:l.split(" ")[1]})}
    }
  };
  w.postMessage("uci");
}
$("retry").onclick=function(){startEngine(0)};
function ask(fen,cmd,skill){
  var p=chain.then(function(){return new Promise(function(res){
    pending={res:res,s:null};
    eng.postMessage("setoption name Skill Level value "+(skill===undefined?20:skill));
    eng.postMessage("position fen "+fen);eng.postMessage(cmd);
  })});
  chain=p.catch(function(){});return p;
}
function evOf(f){
  var g=new Chess(f);
  if(g.game_over())return Promise.resolve({cp:g.in_checkmate()?(f.split(" ")[1]==="w"?-10000:10000):0,best:null});
  return ask(f,"go depth 14 movetime 700").then(function(r){return {cp:whiteCp(f,r.s),best:r.best}});
}
function evTxt(e){var c=e.cp;if(Math.abs(c)>9000)return c>0?"mate a favor de las blancas":"mate a favor de las negras";return (c>=0?"+":"")+(c/100).toFixed(2)}
function sugSan(f,e){var m=new Chess(f).move({from:e.best.slice(0,2),to:e.best.slice(2,4),promotion:e.best[4]});return m?m.san:e.best}
function classify(i,e0,e1){
  var m=moves[i],w=m.color==="w",b=wp(e0.cp),a=wp(e1.cp);
  if(!w){b=1-b;a=1-a}
  var loss=Math.max(0,b-a),isBest=e0.best&&e0.best.slice(0,4)===m.from+m.to;
  var k=loss<=0.02?(isBest?"best":"exc"):loss<=0.05?"good":loss<=0.10?"inac":loss<=0.20?"err":"blun";
  if((k==="best"||k==="exc")&&b<0.85&&a>=0.4&&isSacrifice(fens[i+1],m))k="bril";
  if(i<10&&loss<=0.15&&k!=="best"&&k!=="exc")k="book";
  var hint="",bsan=null;
  if((k==="inac"||k==="err"||k==="blun")&&e0.best){
    var bm=new Chess(fens[i]).move({from:e0.best.slice(0,2),to:e0.best.slice(2,4),promotion:e0.best[4]});
    if(bm){bsan=bm.san;hint=" · Mejor era <b>"+bm.san+"</b>"}
  }
  return {k:k,hint:hint,best:bsan,bu:e0.best};
}
/* Análisis en vivo: evalúa la posición actual y valora al instante la jugada que llevó a ella */
async function live(){
  var tok=++liveTok;
  if(!$("live").checked||!ready||busy)return;
  if(pending)eng.postMessage("stop");
  var need=ply>0?[ply-1,ply]:[ply];
  banner();
  for(var k=0;k<need.length;k++){
    var f=fens[need[k]];
    if(evc[f])continue;
    var e=await evOf(f);
    if(tok!==liveTok)return;
    evc[f]=e;
  }
  if(tok!==liveTok)return;
  if(ply>0&&!ana[ply-1])ana[ply-1]=classify(ply-1,evc[fens[ply-1]],evc[fens[ply]]);
  render();
}
$("live").onchange=function(){liveTok++;if(!$("live").checked){if(pending)eng.postMessage("stop");banner()}else live()};
function whiteCp(fen,s){if(!s)return 0;var v=s.t==="mate"?(s.v>0?10000-s.v:-10000-s.v):s.v;return fen.split(" ")[1]==="w"?v:-v}
function wp(cp){return 1/(1+Math.exp(-0.00368208*cp))}

async function engineTurn(){
  if(!$("vs").checked||!ready||game.game_over()||game.turn()!=="b")return;
  busy=true;setEng("El motor está pensando…");
  liveTok++;if(pending)eng.postMessage("stop");
  var r=await ask(game.fen(),"go movetime 500",$("lvl").value);
  var mv=game.move({from:r.best.slice(0,2),to:r.best.slice(2,4),promotion:r.best[4]||"q"});
  busy=false;setEng("Motor listo (Stockfish 10).");
  if(mv)push(mv);else render();
}
function isSacrifice(fenAfter,m){
  var pv=VAL[m.piece],gain=m.captured?VAL[m.captured]:0;
  if(pv<3||gain>=pv)return false;
  var caps=new Chess(fenAfter).moves({verbose:true}).filter(function(x){return x.to===m.to&&x.captured});
  if(!caps.length)return false;
  var worst=0;
  caps.forEach(function(c){
    var g2=new Chess(fenAfter);g2.move(c);
    var rec=g2.moves({verbose:true}).some(function(x){return x.to===m.to&&x.captured})?VAL[c.piece]:0;
    worst=Math.min(worst,gain-pv+rec);
  });
  return worst<=-2;
}
$("ana-btn").onclick=async function(){
  if(busy)return;
  if(!ready){$("sum").textContent="El motor aún no está listo. Estado: "+$("eng-st").textContent;return}
  if(!moves.length){$("sum").textContent="Juega o carga una partida primero.";return}
  liveTok++;if(pending)eng.postMessage("stop");
  busy=true;var n=fens.length;
  for(var i=0;i<n;i++){
    $("sum").textContent="Analizando posición "+(i+1)+" de "+n+"…";
    if(!evc[fens[i]])evc[fens[i]]=await evOf(fens[i]);
  }
  var cnt={};ana=[];
  moves.forEach(function(m,i){var a=classify(i,evc[fens[i]],evc[fens[i+1]]);cnt[a.k]=(cnt[a.k]||0)+1;ana.push(a)});
  $("sum").textContent=Object.keys(LAB).filter(function(k){return cnt[k]}).map(function(k){return cnt[k]+" "+LAB[k][0].toLowerCase()}).join(", ")+".";
  busy=false;render();saveAnalyzed();live();
};
function saveAnalyzed(){
  var me=$("me").value,items=[];
  moves.forEach(function(m,i){
    var a=ana[i];
    if(m.color===me&&a&&(a.k==="err"||a.k==="blun")&&a.best)items.push({fen:fens[i],played:m.san,best:a.best,bestUci:a.bu,kind:a.k,ply:i+1});
  });
  DB.saveGame({startFen:fens[0],sans:moves.map(function(m){return m.san}),ana:ana,me:me,source:"manual"})
    .then(function(g){items.forEach(function(x){x.gameId=g.id});return DB.addRevancha(items)})
    .then(function(){$("sum").textContent+=" Guardada. "+items.length+" posición(es) para Revancha."})
    .catch(function(){});
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
startEngine(0);
render();
})();
</script>
